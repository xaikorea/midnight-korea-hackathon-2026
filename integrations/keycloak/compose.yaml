services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set a local administrator username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set a local administrator password}
    volumes:
      - ./realm.json:/opt/keycloak/data/import/bizproof.json:ro
      - keycloak-data:/opt/keycloak/data
volumes:
  keycloak-data:
