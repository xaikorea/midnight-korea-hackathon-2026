name: bizproof-proof
services:
  node:
    image: midnightntwrk/midnight-node:1.0.0@sha256:ede01da35e982b6a4b85461ad8492ae2753ef14246fba33c8039b782aa8e39fb
    restart: unless-stopped
    environment:
      CFG_PRESET: dev
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    ports: ["127.0.0.1:9944:9944"]
    volumes: ["/srv/bizproof-proof/chain/node:/node/chain"]
    mem_limit: 1g
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9944/health]
      interval: 10s
      timeout: 5s
      retries: 12
  indexer:
    image: midnightntwrk/indexer-standalone:4.3.3@sha256:03afd079b00bcd229df29a24771439c5e7695c339cd89216d0763ce40731cc4b
    restart: unless-stopped
    env_file: /srv/bizproof-proof/releases/contracts/standalone.env.example
    environment:
      APP__APPLICATION__NETWORK_ID: undeployed
      RUST_LOG: info
    ports: ["127.0.0.1:8088:8088"]
    volumes: ["/srv/bizproof-proof/chain/indexer:/data"]
    mem_limit: 1g
    depends_on:
      node: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, cat /var/run/indexer-standalone/running]
      interval: 10s
      timeout: 5s
      retries: 12
  proof-server:
    image: midnightntwrk/proof-server:8.1.0@sha256:801bbc0340e9e96f16735f77b523f23c7459e3359842f7c79c2c53f4e994d531
    restart: unless-stopped
    command: ["midnight-proof-server -v"]
    ports: ["127.0.0.1:6300:6300"]
    mem_limit: 3g
    cpus: 2
  executor:
    profiles: [workers]
    image: ${BIZPROOF_WORKER_IMAGE:-bizproof-proof-worker:recovery-20260925}
    restart: unless-stopped
    user: "11001:11001"
    network_mode: host
    init: true
    command: [node, contracts/sdk/worker-service.mjs, executor, --watch]
    environment:
      BIZPROOF_PROOF_CONFIG: /config/executor.json
      BIZPROOF_PROOF_STATE_DIR: /state
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - /srv/bizproof-proof/secrets/executor.json:/config/executor.json:ro
      - /srv/bizproof-proof/executor:/state
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  verifier:
    profiles: [workers]
    image: ${BIZPROOF_WORKER_IMAGE:-bizproof-proof-worker:recovery-20260925}
    restart: unless-stopped
    user: "11002:11002"
    network_mode: host
    init: true
    command: [node, contracts/sdk/worker-service.mjs, verifier, --watch]
    environment:
      BIZPROOF_PROOF_CONFIG: /config/verifier.json
      BIZPROOF_PROOF_STATE_DIR: /state
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      - /srv/bizproof-proof/secrets/verifier.json:/config/verifier.json:ro
      - /srv/bizproof-proof/verifier:/state
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
